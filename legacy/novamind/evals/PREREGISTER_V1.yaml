# ============================================================================
# PRÉ-REGISTRO DO TESTE DEFINITIVO — NovaMind AGI Validation Track v1
# ============================================================================
# Este protocolo é registrado ANTES de qualquer execução de teste.
# Mudar qualquer critério ou métrica depois dos resultados invalida o teste.
